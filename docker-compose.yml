# Optional local infra — the app runs fine on the default SQLite DB with no Docker at
# all. Use this only if you want Postgres locally instead. Auth is
# Firebase (see backend/.env.example), not part of this compose file.
services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kisansetu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
